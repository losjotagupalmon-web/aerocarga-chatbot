<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEROCARGA | Tu carga en el aire</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#16304d;background:#edf4fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:850px;margin:25px auto;background:white;border-radius:20px;box-shadow:0 12px 40px #1c466027;overflow:hidden}header{background:linear-gradient(120deg,#084a84,#1683bd);color:white;padding:22px 26px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0}main{padding:18px}.messages{height:55vh;min-height:350px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px;background:#f7fbff;border-radius:12px}.bubble{max-width:85%;padding:12px 15px;border-radius:15px;white-space:pre-wrap;line-height:1.5}.bot{background:#e5eff9;align-self:flex-start}.user{background:#0c71ad;color:white;align-self:flex-end}.controls{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:14px;border:1px solid #b7c9d8;border-radius:10px;font-size:16px;min-width:0}button{border:0;background:#096aa7;color:white;border-radius:10px;padding:12px 19px;cursor:pointer;font-weight:600}button:hover{background:#075483}.secondary{background:#e7eef5;color:#1b4665}.privacy{font-size:13px;color:#36546d;margin-top:12px;display:flex;align-items:flex-start;gap:8px}.privacy input{flex:none;min-width:auto;margin-top:3px}.status{font-size:12px;color:#536c81;margin-top:7px}.footer{font-size:12px;color:#587087;text-align:center;padding:12px 18px 20px}@media(max-width:600px){.shell{margin:0;min-height:100vh;border-radius:0}.messages{height:65vh}.bubble{max-width:94%}header h1{font-size:23px}}
</style></head><body><div class="shell"><header><h1>✈️ AEROCARGA</h1><p>Tu Carga en el Aire · Cotizador académico de flete aéreo nacional</p></header><main><div id="messages" class="messages" aria-live="polite"></div><form id="form" class="controls"><input id="input" aria-label="Tu respuesta" placeholder="Escribe tu respuesta..." autocomplete="off" required><button>Enviar</button><button type="button" id="restart" class="secondary">Reiniciar</button></form><label class="privacy"><input id="consent" type="checkbox">Autorizo el almacenamiento de mis datos (nombre, celular y datos del envío) en Google Sheets para fines académicos. Es opcional: puedo cotizar sin autorizar el registro.</label><div id="status" class="status" aria-live="polite"></div></main><div class="footer">Simulación universitaria · Tarifas referenciales, no constituyen oferta comercial real.</div></div><script>
// Reemplaza la URL siguiente con la URL /exec de tu implementación de Google Apps Script.
const SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx3sdpXoH1UaAhXYPCdW1FkLzac9yMQLzK6vHBPd4zUKWZVjp_Av-SP8j_fAuU5VEt_rA/exec';
const destinations=[['Leticia','LET',4800,85000],['Puerto Inírida','PDA',4500,80000],['Mitú','MVP',5000,90000],['Puerto Carreño','PCR',4600,80000],['Barranquilla','BAQ',2200,45000],['Cartagena','CTG',2400,48000],['San Andrés','ADZ',3200,65000],['Rionegro / Medellín','MDE',1800,35000],['Cali','CLO',1600,32000],['Armenia','AXM',1900,38000]];
const kinds={A:['Carga general',0],B:['Perecedera',.20],C:['Animales vivos',.35],D:['Mercancía peligrosa',.50],E:['Sobredimensionada',.40],F:['Frágil',.15],G:['Courier / documentos',null]};
const packs={'1':['Cajas sueltas',0],'2':['Bultos / sacos',.05],'3':['Pallets',.10],'4':['Guacales',.15]};
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);const num=n=>new Intl.NumberFormat('es-CO',{maximumFractionDigits:2}).format(n);const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const msg=document.getElementById('messages'),input=document.getElementById('input');let state,step;
function say(t,who='bot'){const b=document.createElement('div');b.className='bubble '+who;b.textContent=t;msg.appendChild(b);msg.scrollTop=msg.scrollHeight}
function ask(t,next){step=next;say(t)}
function reset(){msg.innerHTML='';state={};step='description';document.getElementById('consent').checked=false;document.getElementById('status').textContent='';say('Bienvenido a Aerocarga, tu carga en el aire ✈️ ¿Qué deseas transportar?')}
const listDest=()=>destinations.map(d=>`${d[0]} (${d[1]})`).join('\n');
const listKinds=()=>Object.entries(kinds).map(([k,v])=>`${k} — ${v[0]}`).join('\n');
const listPacks=()=>Object.entries(packs).map(([k,v])=>`${k} — ${v[0]}`).join('\n');
function positive(v){const x=Number(v.replace(',','.'));return Number.isFinite(x)&&x>0?x:null}
function quote(){const d=state.dest,k=kinds[state.kind],p=packs[state.pack];const volume=state.length*state.width*state.height/6000;const realTotal=state.weight*state.quantity,volumeTotal=volume*state.quantity,charge=Math.max(state.weight,volume)*state.quantity;const raw=charge*d[2]*(1+k[1]+p[1]);const total=Math.max(raw,d[3]);const id='AC-'+Date.now().toString().slice(-8);saveQuote({id,fecha:new Date().toISOString(),nombre:state.name,celular:state.phone,descripcion:state.description,origen:'Bogotá (BOG)',destino:d[0],iata:d[1],mercancia:k[0],empaque:p[0],piezas:state.quantity,largo_cm:state.length,ancho_cm:state.width,alto_cm:state.height,peso_real_total_kg:realTotal,peso_volumetrico_total_kg:volumeTotal,peso_cobrable_kg:charge,tarifa_base_cop_kg:d[2],recargo_mercancia_pct:k[1]*100,recargo_empaque_pct:p[1]*100,tarifa_minima_cop:d[3],total_estimado_cop:total});say(`✈️ COTIZACIÓN ESTIMADA — AEROCARGA 📦\nNúmero: ${id}\n👤 Cliente: ${state.name}\n📱 Celular: ${state.phone}\n🛫 Origen: Bogotá (BOG)\n🛬 Destino: ${d[0]} (${d[1]})\n📦 Descripción: ${state.description}\n🏷️ Mercancía: ${k[0]}\n📦 Empaque: ${p[0]}\n🔢 Piezas: ${state.quantity}\n📐 Dimensiones por pieza: ${state.length} × ${state.width} × ${state.height} cm\n⚖️ Peso real total: ${num(realTotal)} kg\n📏 Peso volumétrico total: ${num(volumeTotal)} kg\n⚖️ Peso cobrable: ${num(charge)} kg\n💵 Tarifa base: ${money(d[2])}/kg\n📈 Recargo mercancía: ${k[1]*100}%\n📈 Recargo empaque: ${p[1]*100}%\n📉 Tarifa mínima: ${money(d[3])}\n💰 VALOR ESTIMADO: ${money(total)}\n\nEste es un valor APROXIMADO. El costo final puede variar según disponibilidad de espacio en bodega, temporada, peso real verificado en báscula certificada y otros recargos aplicables al embarque.\n\n¿Deseas realizar otra cotización? Responde SÍ o NO.`);step='end'}
function saveQuote(data){
  const status=document.getElementById('status');
  if(!document.getElementById('consent').checked){status.textContent='Cotización calculada sin guardar datos (no se otorgó autorización).';return}
  if(!SHEETS_WEB_APP_URL){status.textContent='Registro en Google Sheets aún no configurado. La cotización sí se calculó.';return}
  // Apps Script no permite leer de forma fiable la respuesta de una solicitud no-cors.
  // Por ello se informa que se envió, no que quedó guardada: compruébalo en la hoja.
  const body=new URLSearchParams();
  Object.entries(data).forEach(([k,v])=>body.append(k,String(v)));
  status.textContent='Enviando cotización al registro académico...';
  fetch(SHEETS_WEB_APP_URL,{method:'POST',mode:'no-cors',body})
    .then(()=>{status.textContent='Solicitud enviada. Revisa Google Sheets. El navegador no puede confirmar la entrega.'})
    .catch(()=>{status.textContent='No fue posible enviar el registro. Comprueba la conexión y la URL del servicio.'});
}
function handle(v){switch(step){case'description':state.description=v;ask('Por favor, escribe tu nombre completo.','name');break;case'name':if(v.trim().split(/\s+/).length<2){say('Ingresa tu nombre y apellido.');break}state.name=v;ask('Ingresa tu número de celular colombiano de 10 dígitos.','phone');break;case'phone':if(!/^3\d{9}$/.test(v)){say('Por favor ingresa un número de celular válido de 10 dígitos (ej: 3001234567).');break}state.phone=v;ask('Tu punto de origen es Bogotá (BOG) ✓\n¿A qué destino deseas enviar tu carga? Escribe la ciudad o el código IATA:\n'+listDest(),'dest');break;case'dest':{const n=normalize(v);const d=destinations.find(x=>normalize(x[0])===n||normalize(x[1])===n||normalize(x[0].split('/')[0].trim())===n||normalize(x[0].split('/').pop().trim())===n);if(!d){say('Destino no disponible. Selecciona uno de estos destinos:\n'+listDest());break}state.dest=d;ask('¿Cuál es el tipo de mercancía a transportar? Responde con la letra correspondiente:\n'+listKinds(),'kind');break}case'kind':{const k=v.toUpperCase();if(!kinds[k]){say('Selecciona una letra válida:\n'+listKinds());break}state.kind=k;if(k==='C'||k==='D')say('Este tipo de carga requiere documentación especial. Un asesor te contactará para verificar los requisitos antes de confirmar la cotización.');if(k==='G'){say('El documento establece una tarifa plana por destino para courier/documentos hasta 30 kg, pero no incluye sus valores. Por ello no es posible calcular una cotización de courier sin definir esas tarifas. Selecciona otro tipo de mercancía para continuar.');step='kind';break}ask('Indica el LARGO de cada pieza en centímetros (ejemplo: 50).','length');break}case'length':case'width':case'height':case'weight':{const n=positive(v);if(n===null){say('Ingresa un valor numérico mayor que cero (ejemplo: 50 o 12,5).');break}state[step]=n;if(step==='length')ask('¿Cuál es el ANCHO de cada pieza en centímetros?','width');else if(step==='width')ask('¿Cuál es el ALTO de cada pieza en centímetros?','height');else if(step==='height')ask('¿Cuál es el PESO REAL de cada pieza en kilogramos?','weight');else ask('¿Cuántas piezas iguales deseas enviar? Escribe un número entero.','quantity');break}case'quantity':{const n=Number(v);if(!Number.isSafeInteger(n)||n<=0){say('Ingresa una cantidad entera de piezas mayor que cero.');break}state.quantity=n;ask('¿Cómo viene empacada tu mercancía?\n'+listPacks()+'\n\nIMPORTANTE: Si deseas guardar tu cotización en Google Sheets, marca la casilla de autorización debajo del chat ANTES de responder.','pack');break}case'pack':if(!packs[v]){say('Selecciona una opción válida:\n'+listPacks());break}state.pack=v;quote();break;case'end':if(['si','sí','s','otra','cotizar'].includes(normalize(v)))reset();else say('Gracias por utilizar AEROCARGA. ¡Buen día! ✈️ Si deseas comenzar de nuevo, pulsa Reiniciar.');break}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const v=input.value.trim();if(!v)return;say(v,'user');input.value='';handle(v);input.focus()});document.getElementById('restart').addEventListener('click',reset);reset();
</script></body></html>
